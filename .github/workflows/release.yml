name: Release

on:
  push:
    tags:
      - '[0-9]*'
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 1.5.1). Tag v{version} will be created.'
        required: true
      release_notes:
        description: 'Release notes (Markdown). Copy template from .github/RELEASE_TEMPLATE.md'
        required: true
        type: string
        default: '**Full Changelog**: https://github.com/2228293026/JipperKeyViewer/compare/vPREV...vVERSION\n\n# :tada: JipperKeyViewer vVERSION\n## :sparkles: New Features\n\n## :bug: Bug Fixes\n\n\n# Supports Alpha latest / 支持Alpha最新 / Alpha 최신 버전 지원'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkout game DLLs
        uses: actions/checkout@v6
        with:
          repository: 2228293026/adofai-libs
          token: ${{ secrets.LIBS_ACCESS_TOKEN }}
          path: libs

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Restore NuGet packages
        run: dotnet restore JipperKeyViewer.slnx

      - name: Set version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event.inputs.version }}") {
            $v = "${{ github.event.inputs.version }}"
          } else {
            $v = "${{ github.ref_name }}"
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Version: $v"

      - name: Detect prerelease
        id: pre
        shell: pwsh
        run: |
          if ("${{ steps.ver.outputs.version }}" -match '-(pre|rc|alpha|beta|dev)') {
            "is_prerelease=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            "is_prerelease=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      # Patch the version into the sources before building: the projects deliberately keep the
      # hand-written AssemblyInfo.cs as the single version source (GenerateAssemblyInfo=false,
      # msbuild's /p:Version stays ignored), and the version also lives in Info.json /
      # Repository.json / [MelonInfo]. The same script can be run locally before tagging a release.
      # 构建前把版本号打进源码：各工程刻意保留手写 AssemblyInfo.cs 作为唯一版本来源
      #（GenerateAssemblyInfo=false，/p:Version 依然无效），版本号还存在于
      # Info.json / Repository.json / [MelonInfo]。打 tag 发版前本地也可运行同一脚本。
      - name: Apply version to sources
        shell: pwsh
        run: ./tools/SetVersion.ps1 -Version "${{ steps.ver.outputs.version }}"

      # ========== Build All (6 projects) ==========

      - name: Build core (AssetBundle)
        run: msbuild JipperKeyViewer\JipperKeyViewer.csproj /p:Configuration=Release /p:Platform="AnyCPU"

      - name: Build Loader.UMM (AssetBundle)
        run: msbuild JipperKeyViewer.Loader.UMM\JipperKeyViewer.Loader.UMM.csproj /p:Configuration=Release /p:Platform="AnyCPU"

      - name: Build Loader.Melon (AssetBundle)
        run: msbuild JipperKeyViewer.Loader.Melon\JipperKeyViewer.Loader.Melon.csproj /p:Configuration=Release /p:Platform="AnyCPU"

      - name: Build core (FileBased)
        run: msbuild JipperKeyViewer-FileBased\JipperKeyViewer-FileBased.csproj /p:Configuration=Release /p:Platform="AnyCPU"

      - name: Build Loader.UMM (FileBased)
        run: msbuild JipperKeyViewer-FileBased.Loader.UMM\JipperKeyViewer-FileBased.Loader.UMM.csproj /p:Configuration=Release /p:Platform="AnyCPU"

      - name: Build Loader.Melon (FileBased)
        run: msbuild JipperKeyViewer-FileBased.Loader.Melon\JipperKeyViewer-FileBased.Loader.Melon.csproj /p:Configuration=Release /p:Platform="AnyCPU"

      # ========== Package AssetBundle (UMM + MelonLoader) ==========

      - name: Package JipperKeyViewer (AssetBundle)
        shell: pwsh
        run: |
          $dist = "dist\JipperKeyViewer"
          New-Item -ItemType Directory -Force -Path $dist\assets | Out-Null
          Copy-Item JipperKeyViewer\bin\Release\JipperKeyViewer.dll $dist\
          Copy-Item JipperKeyViewer.Loader.UMM\bin\Release\JipperKeyViewer.Loader.UMM.dll $dist\
          Copy-Item JipperKeyViewer.Loader.Melon\bin\Release\JipperKeyViewer.Loader.Melon.dll $dist\
          Copy-Item Info.json $dist\
          $info = Get-Content $dist\Info.json -Raw | ConvertFrom-Json
          $info.Version = '${{ steps.ver.outputs.version }}'
          $info | ConvertTo-Json | Set-Content $dist\Info.json -Encoding utf8
          Copy-Item JipperKeyViewer\assets\keyviewer_resources $dist\assets\

      # ========== Package FileBased (UMM + MelonLoader) ==========

      - name: Package JipperKeyViewer-FileBased
        shell: pwsh
        run: |
          $dist = "dist\JipperKeyViewer-FileBased"
          New-Item -ItemType Directory -Force -Path $dist\assets | Out-Null
          Copy-Item JipperKeyViewer-FileBased\bin\Release\JipperKeyViewer-FileBased.dll $dist\
          Copy-Item JipperKeyViewer-FileBased.Loader.UMM\bin\Release\JipperKeyViewer-FileBased.Loader.UMM.dll $dist\
          Copy-Item JipperKeyViewer-FileBased.Loader.Melon\bin\Release\JipperKeyViewer-FileBased.Loader.Melon.dll $dist\
          Copy-Item JipperKeyViewer-FileBased\Info.json $dist\
          $info = Get-Content $dist\Info.json -Raw | ConvertFrom-Json
          $info.Version = '${{ steps.ver.outputs.version }}'
          $info | ConvertTo-Json | Set-Content $dist\Info.json -Encoding utf8
          Copy-Item JipperKeyViewer-FileBased\assets\* $dist\assets\

      - name: Prepare release body
        id: body
        env:
          NOTES: ${{ github.event.inputs.release_notes || '' }}
        shell: pwsh
        run: |
          $date = Get-Date -Format "yyyy-MM-dd"
          "date=$date" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          if ($env:NOTES) {
            $body = $env:NOTES.Replace('\n', "`n") + "`n`n---`n**Build Date**: " + $date
            Set-Content -Path dist\release-body.md -Value $body -Encoding utf8
            "has_body=1" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            "has_body=0" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - name: Zip JipperKeyViewer (AssetBundle)
        shell: pwsh
        run: Compress-Archive -Path dist\JipperKeyViewer\* -DestinationPath dist\JipperKeyViewer-AssetBundle.zip

      - name: Zip JipperKeyViewer-FileBased
        shell: pwsh
        run: Compress-Archive -Path dist\JipperKeyViewer-FileBased\* -DestinationPath dist\JipperKeyViewer-FileBased.zip

      - name: Create GitHub Release (manual dispatch)
        if: steps.body.outputs.has_body == '1'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.version }}
          body_path: dist/release-body.md
          prerelease: ${{ steps.pre.outputs.is_prerelease == 'true' }}
          files: |
            dist/JipperKeyViewer-AssetBundle.zip
            dist/JipperKeyViewer-FileBased.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release (tag push)
        if: steps.body.outputs.has_body == '0'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ steps.pre.outputs.is_prerelease == 'true' }}
          body: |
            ---
            **Build Date**: ${{ steps.body.outputs.date }}
          append_body: true
          files: |
            dist/JipperKeyViewer-AssetBundle.zip
            dist/JipperKeyViewer-FileBased.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
